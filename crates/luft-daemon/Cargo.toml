[package]
name = "luft-daemon"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Daemon process crate — WebSocket server hosting all workflow execution"

[dependencies]
luft       = { path = "../luft", version = "0.5" }
luft-mcp   = { path = "../luft-mcp", version = "0.5" }
luft-core  = { path = "../luft-core", version = "0.5" }
rmcp       = { version = "0.6", features = ["server", "macros", "transport-io"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "io-std", "macros", "net", "process", "signal", "time"] }
tokio-tungstenite = "0.26"
futures     = "0.3"
tracing     = "0.1"
chrono      = { version = "0.4", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
luft-core = { path = "../luft-core", version = "0.5", features = ["testing"] }
