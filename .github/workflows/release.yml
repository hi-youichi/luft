name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: luft
            asset_name: luft-x86_64-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: luft
            asset_name: luft-aarch64-linux-gnu
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: luft
            asset_name: luft-x86_64-linux-musl
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: luft.exe
            asset_name: luft-x86_64-windows-msvc
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: luft
            asset_name: luft-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: luft
            asset_name: luft-aarch64-apple-darwin

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      if: matrix.cross == true
      run: cargo install cross

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build
      run: |
        if [ "${{ matrix.cross }}" = "true" ]; then
          cross build --release --target ${{ matrix.target }} --bin luft
        else
          cargo build --release --target ${{ matrix.target }} --bin luft
        fi
      shell: bash

    - name: Strip binary
      if: matrix.os != 'windows-latest'
      run: |
        STRIP="${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-strip' || 'strip' }}"
        $STRIP target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
      shell: bash

    - name: Package (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
        cd ../../..
        shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
      shell: bash

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}.zip
        $hash = (Get-FileHash ${{ matrix.asset_name }}.zip -Algorithm SHA256).Hash
        "$hash  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ascii ${{ matrix.asset_name }}.zip.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          ${{ matrix.asset_name }}.*
          !*.sha256

    - name: Upload checksum
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}-checksum
        path: ${{ matrix.asset_name }}.*.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: assets
        merge-multiple: true

    - name: List assets
      run: ls -la assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          assets/*.tar.gz
          assets/*.zip
          assets/*.sha256
